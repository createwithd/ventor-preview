name: Preview publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site samenstellen (na 22 november alleen de melding "verlopen")
        run: |
          mkdir -p _site
          if [ "$(date -u +%Y%m%d)" -ge 20261121 ]; then
            for p in . consument horeca; do mkdir -p "_site/$p"; cp verlopen/index.html "_site/$p/index.html"; done
            cp verlopen/index.html _site/404.html
          else
            cp -r site/. _site/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
